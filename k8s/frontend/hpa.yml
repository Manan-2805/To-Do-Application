apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todosphere-frontend-hpa
  namespace: todosphere
  labels:
    app: todosphere-frontend
    app.kubernetes.io/part-of: todosphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todosphere-frontend
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
