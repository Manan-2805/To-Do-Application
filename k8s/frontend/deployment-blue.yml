apiVersion: apps/v1
kind: Deployment
metadata:
  name: todosphere-frontend-blue
  namespace: todosphere
  labels:
    app: todosphere-frontend
    slot: blue
    app.kubernetes.io/part-of: todosphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todosphere-frontend
      slot: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: todosphere-frontend
        slot: blue
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: frontend
          image: ghcr.io/manan-2805/to-do-application/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
