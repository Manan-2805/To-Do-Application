apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todosphere-backend-blue-hpa
  namespace: todosphere
  labels:
    app: todosphere-backend
    slot: blue
    app.kubernetes.io/part-of: todosphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todosphere-backend-blue
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: todosphere-backend-green-hpa
  namespace: todosphere
  labels:
    app: todosphere-backend
    slot: green
    app.kubernetes.io/part-of: todosphere
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: todosphere-backend-green
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
