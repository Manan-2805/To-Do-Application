apiVersion: apps/v1
kind: Deployment
metadata:
  name: todosphere-backend-blue
  namespace: todosphere
  labels:
    app: todosphere-backend
    slot: blue
    app.kubernetes.io/part-of: todosphere
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todosphere-backend
      slot: blue
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: todosphere-backend
        slot: blue
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: ghcr.io/manan-2805/to-do-application/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: todosphere-config
            - secretRef:
                name: todosphere-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
