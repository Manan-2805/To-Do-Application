apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: todosphere
  labels:
    app: postgres
    app.kubernetes.io/part-of: todosphere
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - postgres
            - -c
            - max_connections=250
            - -c
            - shared_buffers=256MB
            - -c
            - effective_cache_size=512MB
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: todosphere
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todosphere-secrets
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 2Gi
