apiVersion: v1
kind: ConfigMap
metadata:
  name: todosphere-config
  namespace: todosphere
  labels:
    app.kubernetes.io/part-of: todosphere
data:
  APP_NAME: "TodoSphere API"
  API_V1_STR: "/api/v1"
  JWT_ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  REDIS_URL: "redis://redis.todosphere.svc.cluster.local:6379/0"
  STORAGE_PROVIDER: "s3"
  S3_BUCKET_NAME: "todosphere-attachments"
  S3_ENDPOINT_URL: "http://localstack.todosphere.svc.cluster.local:4566"
  AWS_DEFAULT_REGION: "us-east-1"
  UPLOAD_DIR: "/app/uploads"
  PERFORMANCE_TEST: "true"
  DEBUG: "false"
  CORS_ORIGINS: '["http://localhost:8080", "http://localhost:8081"]'
