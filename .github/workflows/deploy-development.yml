name: Deploy to Development

on:
  push:
    branches:
      - development

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to KinD
    runs-on: [self-hosted, windows, local, kind]
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract commit SHA
        run: |
          echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Downcase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Log in to GHCR
        run: |
          docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

      - name: Get PR Information
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_INFO=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0]')
          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number')
          PR_HEAD_SHA=$(echo "$PR_INFO" | jq -r '.head.sha')
          if [ -z "$PR_HEAD_SHA" ] || [ "$PR_HEAD_SHA" = "null" ]; then
            echo "No merged PR found. Falling back to commit SHA."
            PR_HEAD_SHA="${{ github.sha }}"
            PR_NUMBER="direct"
          fi
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_HEAD_SHA=$PR_HEAD_SHA" >> $GITHUB_ENV

      - name: Pull and Tag Images
        run: |
          if [ "${{ env.PR_NUMBER }}" = "direct" ]; then
            BACKEND_TARGET_TAG="ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:${{ env.PR_HEAD_SHA }}"
            FRONTEND_TARGET_TAG="ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:${{ env.PR_HEAD_SHA }}"

            # Pull directly from GHCR
            docker pull $BACKEND_TARGET_TAG
            docker pull $FRONTEND_TARGET_TAG

            docker tag $BACKEND_TARGET_TAG ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:${{ env.SHA }}
            docker tag $FRONTEND_TARGET_TAG ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:${{ env.SHA }}
          else
            BACKEND_TARGET_TAG="ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:pr-${{ env.PR_NUMBER }}"
            FRONTEND_TARGET_TAG="ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:pr-${{ env.PR_NUMBER }}"

            # Pull directly from GHCR (guaranteed to exist)
            docker pull $BACKEND_TARGET_TAG
            docker pull $FRONTEND_TARGET_TAG

            docker tag $BACKEND_TARGET_TAG ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:${{ env.SHA }}
            docker tag $FRONTEND_TARGET_TAG ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:${{ env.SHA }}
          fi

          # Extract digests locally
          BACKEND_DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{end}}' ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:${{ env.SHA }} 2>/dev/null || true)
          if [ -z "$BACKEND_DIGEST" ]; then
            BACKEND_DIGEST=$(docker inspect --format='{{.Id}}' ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:${{ env.SHA }})
          fi

          FRONTEND_DIGEST=$(docker inspect --format='{{range .RepoDigests}}{{.}}{{end}}' ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:${{ env.SHA }} 2>/dev/null || true)
          if [ -z "$FRONTEND_DIGEST" ]; then
            FRONTEND_DIGEST=$(docker inspect --format='{{.Id}}' ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:${{ env.SHA }})
          fi

          echo "BACKEND_DIGEST=$BACKEND_DIGEST" >> $GITHUB_ENV
          echo "FRONTEND_DIGEST=$FRONTEND_DIGEST" >> $GITHUB_ENV

      - name: Load Images into KinD Cluster
        run: |
          # Tag images as :latest so the initial manifest apply (which references :latest) works
          docker tag ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:${{ env.SHA }} \
            ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:latest
          docker tag ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:${{ env.SHA }} \
            ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:latest

          # Load all images directly into KinD so the cluster never needs to pull from GHCR
          kind load docker-image \
            ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:latest \
            ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:${{ env.SHA }} \
            --name todosphere
          kind load docker-image \
            ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:latest \
            ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:${{ env.SHA }} \
            --name todosphere

      - name: Apply Base Kubernetes Manifests
        run: |
          # Apply namespace first
          kubectl apply -f k8s/namespace.yml

          # Create GHCR image pull secret so KinD cluster can pull private images
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace=todosphere \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

          # Patch default ServiceAccount to use the pull secret (applies to all pods)
          kubectl patch serviceaccount default -n todosphere \
            -p '{"imagePullSecrets": [{"name": "ghcr-pull-secret"}]}'

          # Create Secrets (CORS_ORIGINS is in ConfigMap, not here)
          # Note: In production, configure these as GitHub Secrets.
          DB_PASS="${{ secrets.DB_PASSWORD_PLACEHOLDER }}"
          if [ -z "$DB_PASS" ]; then DB_PASS="safe-dev-db-password-placeholder"; fi

          DATABASE_URL="postgresql+asyncpg://postgres:$DB_PASS@postgres.todosphere.svc.cluster.local:5432/todosphere"

          JWT_ACC="${{ secrets.JWT_ACCESS_SECRET_PLACEHOLDER }}"
          if [ -z "$JWT_ACC" ]; then JWT_ACC="safe-jwt-access-secret-placeholder"; fi

          JWT_REF="${{ secrets.JWT_REFRESH_SECRET_PLACEHOLDER }}"
          if [ -z "$JWT_REF" ]; then JWT_REF="safe-jwt-refresh-secret-placeholder"; fi

          kubectl create secret generic todosphere-secrets \
            --namespace=todosphere \
            --from-literal=DB_PASSWORD="$DB_PASS" \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=JWT_ACCESS_SECRET="$JWT_ACC" \
            --from-literal=JWT_REFRESH_SECRET="$JWT_REF" \
            --from-literal=S3_ACCESS_KEY="test" \
            --from-literal=S3_SECRET_KEY="test" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f k8s/configmap.yml
          kubectl apply -f k8s/postgres/
          kubectl rollout status statefulset/postgres -n todosphere --timeout=120s
          kubectl apply -f k8s/redis/
          kubectl rollout status deployment/redis -n todosphere --timeout=60s
          kubectl apply -f k8s/localstack/
          kubectl rollout status deployment/localstack -n todosphere --timeout=90s

          # Apply the blue/green deployments and services
          kubectl apply -f k8s/backend/
          kubectl apply -f k8s/frontend/
          kubectl apply -f k8s/ingress/ingress.yml

      - name: "Blue-Green Deploy - Step 1: Detect Active and Standby Slots"
        run: |
          ACTIVE=$(kubectl get service todosphere-backend -n todosphere -o jsonpath='{.spec.selector.slot}')
          if [ -z "$ACTIVE" ] || [ "$ACTIVE" = "null" ]; then
            ACTIVE="blue"
          fi
          if [ "$ACTIVE" = "blue" ]; then
            STANDBY="green"
          else
            STANDBY="blue"
          fi
          echo "ACTIVE=$ACTIVE" >> $GITHUB_ENV
          echo "STANDBY=$STANDBY" >> $GITHUB_ENV
          echo "Active slot is: $ACTIVE, Standby slot is: $STANDBY"

      - name: "Blue-Green Deploy - Step 2: Update Standby Image & Wait"
        run: |
          echo "Updating deployment/todosphere-backend-${{ env.STANDBY }} to ${{ env.BACKEND_DIGEST }}..."
          kubectl set image deployment/todosphere-backend-${{ env.STANDBY }} backend=${{ env.BACKEND_DIGEST }} -n todosphere

          echo "Updating deployment/todosphere-frontend-${{ env.STANDBY }} to ${{ env.FRONTEND_DIGEST }}..."
          kubectl set image deployment/todosphere-frontend-${{ env.STANDBY }} frontend=${{ env.FRONTEND_DIGEST }} -n todosphere

          echo "Waiting for backend standby deployment rollout..."
          kubectl rollout status deployment/todosphere-backend-${{ env.STANDBY }} -n todosphere --timeout=180s

          echo "Waiting for frontend standby deployment rollout..."
          kubectl rollout status deployment/todosphere-frontend-${{ env.STANDBY }} -n todosphere --timeout=180s

      - name: "Blue-Green Deploy - Step 3: Run Database Migrations on Standby Pod"
        run: |
          # Retrieve name of a running, non-terminating pod in the standby slot
          for i in {1..10}; do
            STANDBY_POD=$(kubectl get pods -n todosphere -l app=todosphere-backend,slot=${{ env.STANDBY }} -o json | jq -r '.items[] | select(.status.phase=="Running" and .metadata.deletionTimestamp==null) | .metadata.name' | head -n 1)
            if [ -n "$STANDBY_POD" ]; then
              break
            fi
            echo "Waiting for a running, non-terminating standby pod..."
            sleep 2
          done

          if [ -z "$STANDBY_POD" ]; then
            echo "Error: No running standby pod found!"
            exit 1
          fi

          echo "Running database migrations in standby pod: $STANDBY_POD..."
          kubectl exec -n todosphere $STANDBY_POD -- alembic upgrade head

      - name: "Blue-Green Deploy - Step 4: Switch Traffic to Standby Slot"
        run: |
          echo "Switching backend service selector to ${{ env.STANDBY }}..."
          kubectl patch service todosphere-backend -n todosphere -p "{\"spec\":{\"selector\":{\"app\":\"todosphere-backend\",\"slot\":\"${{ env.STANDBY }}\"}}}"

          echo "Switching frontend service selector to ${{ env.STANDBY }}..."
          kubectl patch service todosphere-frontend -n todosphere -p "{\"spec\":{\"selector\":{\"app\":\"todosphere-frontend\",\"slot\":\"${{ env.STANDBY }}\"}}}"

          echo "DEPLOY_STARTED=true" >> $GITHUB_ENV

      - name: "Blue-Green Deploy - Step 5: Post-Deploy Ingress Health Check"
        run: |
          echo "Verifying live site endpoints through Ingress..."
          # Give Ingress controller a few seconds to update routing
          sleep 5
          curl --retry 6 --retry-delay 10 --retry-connrefused -sf http://localhost:8080/
          curl --retry 6 --retry-delay 10 --retry-connrefused -sf http://localhost:8080/health/ready

      - name: "Blue-Green Deploy - Step 6: Rollback on Post-Deploy Failure"
        if: failure() && env.DEPLOY_STARTED == 'true'
        run: |
          echo "Post-deploy health check failed! Rolling back service selectors to ${{ env.ACTIVE }} slot..."
          kubectl patch service todosphere-backend -n todosphere -p "{\"spec\":{\"selector\":{\"app\":\"todosphere-backend\",\"slot\":\"${{ env.ACTIVE }}\"}}}"
          kubectl patch service todosphere-frontend -n todosphere -p "{\"spec\":{\"selector\":{\"app\":\"todosphere-frontend\",\"slot\":\"${{ env.ACTIVE }}\"}}}"

      - name: Update Latest Tag in GHCR
        run: |
          docker tag ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:${{ env.SHA }} ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:latest
          docker push ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:latest
          docker tag ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:${{ env.SHA }} ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:latest
          docker push ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:latest

      - name: Delete PR Images from GHCR
        if: success() && env.PR_NUMBER != 'direct'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting backend PR image from GHCR..."
          BACKEND_VERSION_ID=$(gh api "users/${{ env.OWNER_LC }}/packages/container/to-do-application%2Fbackend/versions" --jq ".[] | select(.metadata.container.tags[] == \"pr-${{ env.PR_NUMBER }}\") | .id" 2>/dev/null || true)
          if [ -n "$BACKEND_VERSION_ID" ]; then
            gh api -X DELETE "users/${{ env.OWNER_LC }}/packages/container/to-do-application%2Fbackend/versions/$BACKEND_VERSION_ID" || echo "Failed to delete backend PR version"
          fi

          echo "Deleting frontend PR image from GHCR..."
          FRONTEND_VERSION_ID=$(gh api "users/${{ env.OWNER_LC }}/packages/container/to-do-application%2Ffrontend/versions" --jq ".[] | select(.metadata.container.tags[] == \"pr-${{ env.PR_NUMBER }}\") | .id" 2>/dev/null || true)
          if [ -n "$FRONTEND_VERSION_ID" ]; then
            gh api -X DELETE "users/${{ env.OWNER_LC }}/packages/container/to-do-application%2Ffrontend/versions/$FRONTEND_VERSION_ID" || echo "Failed to delete frontend PR version"
          fi

      - name: Notify Workflow Status
        if: always()
        run: |
          echo "=== Deploy to Development Status: ${{ job.status }} ==="
          echo "Commit: ${{ github.sha }}"
          echo "Active Slot: ${{ env.STANDBY || env.ACTIVE }}"
          echo "Workflow Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # TODO: Configure Slack/Discord/Webhook notifications in your public repo.
          # Example:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"Deploy to Development: ${{ job.status }}. Commit: ${{ github.sha }}. Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
          #   "${{ secrets.NOTIFICATION_WEBHOOK_URL_PLACEHOLDER }}"

      - name: Disk Cleanup
        if: always()
        run: |
          # Clean up tags we created/pulled during this run
          docker rmi ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:pr-${{ env.PR_NUMBER }} || true
          docker rmi ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:pr-${{ env.PR_NUMBER }} || true
          docker rmi ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:${{ env.SHA }} || true
          docker rmi ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:${{ env.SHA }} || true
          docker rmi ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:latest || true
          docker rmi ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:latest || true
          docker image prune -f
