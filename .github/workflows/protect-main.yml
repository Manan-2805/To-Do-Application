name: Protect Main Branch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: protect-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-source-branch:
    name: Validate PR Source Branch
    runs-on: ubuntu-latest

    steps:
      - name: Validate source branch
        run: |
          if [[ "${{ github.head_ref }}" != "development" ]]; then
            echo "Error: PRs to main are only allowed from the development branch."
            echo "Source branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "Source branch is development. Validation passed."
