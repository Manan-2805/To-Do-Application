name: PR Quality Gate

on:
  pull_request:
    branches:
      - development
    paths:
      # Backend
      - "backend/**/*.py"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "backend/Dockerfile"

      # Frontend
      - "frontend/**/*.js"
      - "frontend/**/*.jsx"
      - "frontend/**/*.ts"
      - "frontend/**/*.tsx"
      - "frontend/**/*.css"
      - "frontend/**/*.json"
      - "frontend/**/*.html"
      - "frontend/Dockerfile"

      # Infrastructure & Scripts
      - "k8s/**/*.yml"
      - "k8s/**/*.yaml"
      - ".github/workflows/**/*.yml"
      - "docker-compose*.yml"
      - "Makefile"
      - "scripts/**/*.sh"

      # Explicitly Ignore (these are implicitly ignored, but added for clarity)
      - "!**/*.md"
      - "!**/*.txt"
      - "!LICENSE"
      - "!**/.gitignore"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-check:
    name: Branch Up-to-Date Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ !startsWith(github.event.pull_request.title, 'revert:') && !contains(github.event.pull_request.title, 'skip pr-check') && !contains(github.event.pull_request.title, 'skip pr check') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check branch is up to date with development
        run: |
          git fetch origin development
          if ! git merge-base --is-ancestor origin/development HEAD; then
            echo "This branch is behind 'development'. Please rebase or merge development into your branch before opening a PR."
            exit 1
          fi
          echo "Branch is up to date with development."

  backend-checks:
    name: Backend Checks
    runs-on: ubuntu-latest
    needs: [branch-check]
    permissions:
      contents: read
    if: ${{ !startsWith(github.event.pull_request.title, 'revert:') && !contains(github.event.pull_request.title, 'skip pr-check') && !contains(github.event.pull_request.title, 'skip pr check') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "backend/.python-version"

      - name: Install dependencies
        run: |
          cd backend
          uv sync --frozen

      - name: Run Ruff Lint
        run: |
          cd backend
          uv run ruff check src/ tests/

      - name: Run Ruff Format
        run: |
          cd backend
          uv run ruff format --check src/ tests/ scripts/

      - name: Run MyPy
        run: |
          cd backend
          uv run mypy -p src

      - name: Run Bandit
        run: |
          cd backend
          uv run bandit -c pyproject.toml -r src/

      - name: Run pip-audit
        run: |
          cd backend
          uv run pip-audit

  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: [branch-check]
    permissions:
      contents: read
    if: ${{ !startsWith(github.event.pull_request.title, 'revert:') && !contains(github.event.pull_request.title, 'skip pr-check') && !contains(github.event.pull_request.title, 'skip pr check') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Prettier check
        run: |
          cd frontend
          npm run format:check

      - name: Run TypeScript compiler
        run: |
          cd frontend
          npx tsc -b

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]
    permissions:
      contents: read
    if: ${{ !startsWith(github.event.pull_request.title, 'revert:') && !contains(github.event.pull_request.title, 'skip pr-check') && !contains(github.event.pull_request.title, 'skip pr check') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.95.2
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Trivy FS Scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: 1
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true

      - name: Check trailing whitespace
        run: |
          git diff --check ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

      - name: Check merge conflict markers
        run: |
          files=$(git diff --name-only --diff-filter=d ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          if [ -n "$files" ]; then
            if echo "$files" | xargs grep -E "^(<<<<<<<|=======|>>>>>>>)" 2>/dev/null; then
              echo "Error: Merge conflict markers found in changed files."
              exit 1
            fi
          fi

      - name: Check for large files
        run: |
          large_files=$(find . -type f -size +1M \
            -not -path '*/.*' \
            -not -path './node_modules/*' \
            -not -path './backend/.venv/*' \
            -not -path './backend/uploads/*' \
            -not -path './frontend/playwright-report/*' \
            -not -path './frontend/dist/*' \
            -not -name 'uv.lock' \
            -not -name 'package-lock.json')
          if [ -n "$large_files" ]; then
            echo "Error: Large files (>1MB) found in repository:"
            echo "$large_files"
            exit 1
          fi

  build-scan-push:
    name: Build, Scan and Push
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, security-scan]
    permissions:
      contents: read
      packages: write
    if: ${{ !startsWith(github.event.pull_request.title, 'revert:') && !contains(github.event.pull_request.title, 'skip pr-check') && !contains(github.event.pull_request.title, 'skip pr check') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Downcase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
        env:
          OWNER: "${{ github.repository_owner }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend (Local Load for Scan)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan Backend Image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:pr-${{ github.event.pull_request.number }}
          format: "table"
          exit-code: 1
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Push Backend Image
        id: push_backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha

      - name: Build Frontend (Local Load for Scan)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan Frontend Image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:pr-${{ github.event.pull_request.number }}
          format: "table"
          exit-code: 1
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Push Frontend Image
        id: push_frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha

      - name: Create or Update PR Comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY=$(cat << 'EOF'
          ### TodoSphere Images Built Successfully!

          Docker images have been built and pushed to GHCR.

          **Tags:**
          - `ghcr.io/${{ env.OWNER_LC }}/to-do-application/backend:pr-${{ github.event.pull_request.number }}`
          - `ghcr.io/${{ env.OWNER_LC }}/to-do-application/frontend:pr-${{ github.event.pull_request.number }}`

          *Pushed at: ${{ github.run_started_at }}*
          EOF
          )

          # Try to update existing comment first, else create new one
          if ! gh pr comment ${{ github.event.pull_request.number }} --edit-last || true; then
            gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT_BODY"
          fi

  notify:
    name: Notify Status
    runs-on: ubuntu-latest
    needs:
      - branch-check
      - backend-checks
      - frontend-checks
      - security-scan
      - build-scan-push
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Notify Status
        run: |
          echo "=== PR Quality Gate Status ==="
          echo "Branch Check: ${{ needs.branch-check.result }}"
          echo "Backend: ${{ needs.backend-checks.result }}"
          echo "Frontend: ${{ needs.frontend-checks.result }}"
          echo "Security Scan: ${{ needs.security-scan.result }}"
          echo "Build/Scan/Push: ${{ needs.build-scan-push.result }}"
