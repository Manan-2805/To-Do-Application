[project]
name = "todosphere-backend"
version = "0.1.0"
description = "Backend for TodoSphere"
requires-python = ">=3.12"

dependencies = [
    "aiobotocore>=2.13.0",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "fastapi>=0.111.0, <0.142.0",
    "greenlet>=3.0.3",
    "openpyxl>=3.1.2",
    "pydantic>=2.7.2",
    "pydantic-settings>=2.3.1",
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "pwdlib[argon2]>=0.2.0",
    "redis>=5.0.4",
    "reportlab>=4.2.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "uvicorn[standard]>=0.30.1",
    "prometheus-fastapi-instrumentator>=8.0.0",
    "granian>=2.7.5",
]

[dependency-groups]
dev = [
    "bandit>=1.9.0",
    "faker>=25.0.0",
    "httpx>=0.27.0",
    "locust>=2.29.0",
    "mypy>=1.10.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.6.0",
    "pytest>=8.2.1",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.7",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select =  [
    "E",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RUF",
    "T20",   # print()
    "ARG",   # unused arguments
    "RET",   # return patterns
    "PIE",   # misc bug patterns
    "PT",    # pytest rules
]
ignore = ["B008", "E501", "N818", "B904", "UP042", "UP046"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"src/schemas/response.py" = ["UP046"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = "aiobotocore"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiobotocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reportlab.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "locust"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "locust.*"
ignore_missing_imports = true

[tool.bandit]
skips = ["B104"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "-ra"]

[tool.coverage.run]
fail_under = 90
source = ["src"]
omit = [
    "tests/*",
    "alembic/*",
    "scripts/*",
    "src/core/tracing.py",
    "src/services/storage/s3_provider.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "raise NotImplementedError",
]
