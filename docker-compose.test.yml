services:

  test-db:
    image: postgres:16-alpine
    container_name: todosphere-test-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: todosphere
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - todosphere-test

  test-redis:
    image: redis:7-alpine
    container_name: todosphere-test-redis
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - todosphere-test

  test-localstack:
    image: localstack/localstack:3.4
    container_name: todosphere-test-localstack
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - todosphere-test

  test-backend:
    image: ${BACKEND_IMAGE}
    container_name: todosphere-test-backend
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-localstack:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:testpassword@test-db:5432/todosphere
      REDIS_URL: redis://test-redis:6379/0
      JWT_ACCESS_SECRET: ci-test-secret-access-key-todosphere
      JWT_REFRESH_SECRET: ci-test-secret-refresh-key-todosphere
      CORS_ORIGINS: '["http://localhost:8080"]'
      STORAGE_PROVIDER: s3
      S3_BUCKET_NAME: todosphere-attachments
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      S3_ENDPOINT_URL: http://test-localstack:4566
      PERFORMANCE_TEST: "false"
      PYTHONPATH: /app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - todosphere-test

  test-frontend:
    image: ${FRONTEND_IMAGE}
    container_name: todosphere-test-frontend
    depends_on:
      test-backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - todosphere-test

networks:
  todosphere-test:
    name: todosphere-test
