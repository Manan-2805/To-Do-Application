services:
  localstack:
    image: localstack/localstack:3.4
    container_name: todosphere-infra-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - todosphere-infra

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: todosphere-infra-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - todosphere-infra

volumes:
  localstack_data:
    name: todosphere_infra_localstack_data
  prometheus_data:
    name: todosphere_infra_prometheus_data

networks:
  todosphere-infra:
    name: todosphere-infra
